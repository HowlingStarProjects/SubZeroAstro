name: Build Windows app

# Runs once per release: when a version tag (v0.9.285-beta …) is pushed, or when run by hand (with a release_tag
# for a release, without one for a test build). A plain push to main no longer builds, so a release isn't built twice.
#
# Build machines: GitHub's own (windows-latest / macos-15), or Brian's PC and Mac once they are set up as
# self-hosted runners with the label "subzeroastro" - switched by the repository variable OWN_RUNNERS = true.
# On our own machines the Python 3.13 installed there is used (in a fresh virtual environment for every build).
#
# Downloads: when the secret DOWNLOADS_TOKEN exists, each release is also published to the public downloads repo
# (variable DOWNLOADS_REPO, default HowlingStarProjects/SubZeroAstro-Downloads), where the app's update check
# and subzeroastro.com find it - so this repository can be private.
# 1. installs the libraries on a real Windows machine
# 2. runs the self-test with the real app window (screenshots are kept)
# 3. builds "SubZeroAstro.exe" with PyInstaller and self-tests the .exe too
# 4. releases only: signs SubZeroAstro.exe with Azure Artifact Signing (once the AZURE_* secrets exist)
# 5. uploads the zipped app; for version tags it also creates a GitHub Release
#
# Code signing (free for open source, SignPath Foundation) - see README "Code signing policy".
# Needs, under Settings > Secrets and variables > Actions:
#   secret   SIGNPATH_API_TOKEN          (SignPath > your user > API token, for a CI user)
#   variable SIGNPATH_ORGANIZATION_ID    (SignPath > Organization settings)
#   variable SIGNPATH_PROJECT_SLUG       (optional, default "SubZeroAstro")
#   variable SIGNPATH_POLICY_SLUG        (optional, default "release-signing")
# Without SIGNPATH_ORGANIZATION_ID the build runs exactly as before, unsigned.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Create a GitHub Release with this version tag (e.g. v0.2.0). Leave empty for a test build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ vars.OWN_RUNNERS == 'true' && fromJSON('["self-hosted","Windows","subzeroastro"]') || 'windows-latest' }}
    timeout-minutes: 90           # a signing request waits for the manual approval in SignPath
    env:
      AZ_SIGN: ${{ secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_CLIENT_SECRET != '' }}
      DL_ON: ${{ secrets.DOWNLOADS_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      # can DOWNLOADS_TOKEN publish to the downloads repo? (makes and removes a branch "token-check" there)
      # never stops the build - it only says early, in a test build too, what a release would run into
      - name: Check the downloads repo token
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.DOWNLOADS_TOKEN }}
          DL_REPO: ${{ vars.DOWNLOADS_REPO || 'HowlingStarProjects/SubZeroAstro-Downloads' }}
        run: |
          if ($env:DL_ON -ne 'true') { Write-Host "::warning::DOWNLOADS_TOKEN is not set - releases are not copied to $env:DL_REPO"; exit 0 }
          $sha = gh api "repos/$env:DL_REPO/commits/HEAD" --jq .sha
          if ($LASTEXITCODE -ne 0 -or -not $sha) { throw "DOWNLOADS_TOKEN can't see $env:DL_REPO (does the repo exist?)" }
          gh api -X DELETE "repos/$env:DL_REPO/git/refs/heads/token-check" 2>$null | Out-Null
          gh api -X POST "repos/$env:DL_REPO/git/refs" -f ref=refs/heads/token-check -f sha=$sha | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "DOWNLOADS_TOKEN can't write to $env:DL_REPO (it needs Contents: Read and write on that repo)" }
          gh api -X DELETE "repos/$env:DL_REPO/git/refs/heads/token-check" | Out-Null
          Write-Host "DOWNLOADS_TOKEN OK: can publish to $env:DL_REPO"
          $global:LASTEXITCODE = 0

      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: "3.13"
          cache: pip

      - name: Fresh Python for this build (own PC)
        if: runner.environment != 'github-hosted'
        shell: pwsh
        run: |
          py -3.13 -m venv "$env:RUNNER_TEMP\venv"
          if ($LASTEXITCODE -ne 0) { throw "Python 3.13 is not installed on this PC (python.org, 'Add to PATH')" }
          Add-Content -Path $env:GITHUB_PATH -Value "$env:RUNNER_TEMP\venv\Scripts"

      - name: Install libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Self-test (Python, real window)
        shell: bash
        env:
          PYTHONFAULTHANDLER: "1"
        run: |
          mkdir -p selftest_python
          python subzeroastro.py --selftest selftest_python 2>&1 | tee selftest_python/console.txt
          exit ${PIPESTATUS[0]}

      - name: Build SubZeroAstro.exe
        run: |
          python build_version.py
          pyinstaller --noconfirm --clean --windowed --name "SubZeroAstro" --version-file version_info.txt --icon assets/SubZeroAstro.ico --add-data "docs/SubZeroAstro_User_Manual.pdf;docs" --add-data "assets/icon_256.png;assets" --add-data "assets/splash_radiograph.png;assets" subzeroastro.py

      - name: Self-test (the built .exe)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\SubZeroAstro\SubZeroAstro.exe" -ArgumentList "--selftest", "$PWD\selftest_exe" -Wait -PassThru
          Get-Content selftest_exe\selftest_result.txt
          if ($p.ExitCode -ne 0) { throw "exe self-test failed with exit code $($p.ExitCode)" }

      # Code signing with Azure Artifact Signing (publisher "Brian Poteet"), releases only. Needs the repository
      # secrets AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET (an app registration that has the
      # "Artifact Signing Certificate Profile Signer" role on the signing account); the account, its region and
      # the certificate profile can be changed with the repository variables below.
      - name: Sign SubZeroAstro.exe (Azure Artifact Signing)
        id: azsign
        if: env.AZ_SIGN == 'true' && (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != '')
        continue-on-error: true       # a signing problem (e.g. an expired secret) never holds a release back: it goes out unsigned
        uses: azure/artifact-signing-action@v2
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT || 'https://eus.codesigning.azure.net/' }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT || 'SubZeroAstro' }}
          certificate-profile-name: ${{ vars.AZURE_CERT_PROFILE || 'SubZeroAstroRelease' }}
          files-folder: ${{ github.workspace }}\dist\SubZeroAstro
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Check the signature
        if: steps.azsign.outcome == 'success'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature "dist\SubZeroAstro\SubZeroAstro.exe"
          Write-Host "Signature: $($sig.Status) - $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "signature is not valid: $($sig.Status)" }

      - name: Upload the unsigned app for signing (releases only)
        id: upload-unsigned
        if: vars.SIGNPATH_ORGANIZATION_ID != '' && env.AZ_SIGN != 'true' && (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != '')
        uses: actions/upload-artifact@v4
        with:
          name: SubZeroAstro-unsigned
          path: dist

      - name: Sign SubZeroAstro.exe (SignPath Foundation)
        id: sign
        if: steps.upload-unsigned.outcome == 'success'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'SubZeroAstro' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Use the signed app
        if: steps.sign.outcome == 'success'
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path signed -Recurse -Filter SubZeroAstro.exe | Select-Object -First 1
          if (-not $exe) { throw "signed SubZeroAstro.exe not found" }
          $sig = Get-AuthenticodeSignature $exe.FullName
          Write-Host "Signature: $($sig.Status) - $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "signature is not valid: $($sig.Status)" }
          Copy-Item $exe.FullName "dist\SubZeroAstro\SubZeroAstro.exe" -Force

      - name: Package
        shell: pwsh
        run: |
          Copy-Item README.md "dist\SubZeroAstro\README.md"
          Copy-Item LICENSE "dist\SubZeroAstro\LICENSE.txt"
          Copy-Item docs\SubZeroAstro_User_Manual.pdf "dist\SubZeroAstro\SubZeroAstro_User_Manual.pdf"
          Compress-Archive -Path "dist\SubZeroAstro" -DestinationPath "SubZeroAstro-Windows.zip"

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: SubZeroAstro-Windows
          path: SubZeroAstro-Windows.zip

      - name: Upload self-test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-screenshots
          path: |
            selftest_python
            selftest_exe

      - name: Publish self-test results to the selftest-results branch
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p results
          cp -r selftest_python selftest_exe results/ 2>/dev/null || true
          echo "commit ${{ github.sha }}  run ${{ github.run_id }}  $(date -u)" > results/RUN.txt
          cd results
          git init -q -b selftest-results
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Self-test results for ${{ github.sha }}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" selftest-results

      - name: Create release (version tags, or a release_tag given when run by hand)
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
          SIGNED: ${{ steps.azsign.outcome }}
        run: |
          $pre = @()
          if ($env:TAG -match 'beta|rc|alpha') { $pre = @('--prerelease') }
          # the commit's own description becomes "What's New" (shown in the app's update banner too)
          $news = (git log -1 --format=%B "${{ github.sha }}" | Where-Object { $_ -notmatch '^(Co-Authored-By|Claude-Session):' }) -join "`n"
          $notes = "What's new: " + $news.Trim() + "`n`n" + "Download SubZeroAstro-Windows.zip below, unzip it anywhere, and run 'SubZeroAstro.exe' inside the folder (or use Help > Check for Updates in the app). From subs to masters - zero hassle. No Python needed. " + $(if ($env:SIGNED -eq 'success') { "Signed by the publisher Brian Poteet (Azure Artifact Signing). If Windows SmartScreen still warns while the new signature builds up its reputation, click More info -> Run anyway." } else { "If Windows SmartScreen warns, click More info -> Run anyway." })
          Set-Content -Path release_notes.md -Value $notes -Encoding utf8
          gh release create "$env:TAG" SubZeroAstro-Windows.zip --target "${{ github.sha }}" @pre `
            --title "SubZeroAstro $env:TAG" `
            --notes-file release_notes.md
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }

      # the same release in the public downloads repo (the app's update check and subzeroastro.com read it there)
      - name: Publish the Windows app to the downloads repo
        if: (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != '') && env.DL_ON == 'true'
        shell: pwsh
        env:
          DL_TOKEN: ${{ secrets.DOWNLOADS_TOKEN }}
          GH_TOKEN: ${{ secrets.DOWNLOADS_TOKEN }}
          DL_REPO: ${{ vars.DOWNLOADS_REPO || 'HowlingStarProjects/SubZeroAstro-Downloads' }}
          TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          $pre = @()
          if ($env:TAG -match 'beta|rc|alpha') { $pre = @('--prerelease') }
          gh release create "$env:TAG" SubZeroAstro-Windows.zip -R "$env:DL_REPO" @pre `
            --title "SubZeroAstro $env:TAG" --notes-file release_notes.md
          if ($LASTEXITCODE -ne 0) { throw "could not publish to $env:DL_REPO (does DOWNLOADS_TOKEN still have access?)" }

  build-mac:
    # The same app for Macs with Apple silicon (M1/M2/M3/M4), built and self-tested on a real Mac.
    # Releases are signed with the Developer ID certificate and notarized by Apple when the MACOS_* / APPLE_*
    # secrets are set; if anything with Apple fails, the release still goes out with the old ad-hoc signature.
    needs: build
    if: always()
    # GitHub's Mac (macos-14 was retired on 2026-11-02), or Brian's own Mac with the label "subzeroastro"
    runs-on: ${{ vars.OWN_RUNNERS == 'true' && fromJSON('["self-hosted","macOS","ARM64","subzeroastro"]') || 'macos-15' }}
    timeout-minutes: 90
    env:
      MAC_SIGN: ${{ secrets.MACOS_CERT_P12 != '' && secrets.APPLE_APP_PASSWORD != '' }}
      DL_ON: ${{ secrets.DOWNLOADS_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: runner.environment == 'github-hosted'
        with:
          python-version: "3.13"
          cache: pip

      - name: Fresh Python for this build (own Mac)
        if: runner.environment != 'github-hosted'
        run: |
          PY=$(command -v python3.13 || echo /Library/Frameworks/Python.framework/Versions/3.13/bin/python3.13)
          [ -x "$PY" ] || { echo "Python 3.13 is not installed on this Mac (python.org installer)"; exit 1; }
          "$PY" -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Install libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Self-test (Python, real window)
        env:
          PYTHONFAULTHANDLER: "1"
        run: |
          mkdir -p selftest_mac
          python subzeroastro.py --selftest selftest_mac 2>&1 | tee selftest_mac/console.txt
          exit ${PIPESTATUS[0]}

      - name: Build SubZeroAstro.app
        run: |
          pyinstaller --noconfirm --clean --windowed --name "SubZeroAstro" \
            --osx-bundle-identifier io.github.bapoteet.subzeroastro \
            --icon assets/SubZeroAstro.icns \
            --add-data "docs/SubZeroAstro_User_Manual.pdf:docs" --add-data "assets/icon_256.png:assets" --add-data "assets/splash_radiograph.png:assets" subzeroastro.py
          VER=$(python -c "import re;print(re.search(r'^APP_VERSION = \"([^\"]+)\"', open('subzeroastro.py').read(), re.M).group(1))")
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${VER%% *}" dist/SubZeroAstro.app/Contents/Info.plist || true
          # FITS / XISF files: SubZeroAstro can be chosen to open them (Get Info > Open with > Change All)
          PL=dist/SubZeroAstro.app/Contents/Info.plist
          PB=/usr/libexec/PlistBuddy
          $PB -c "Add :UTImportedTypeDeclarations array" $PL || true
          i=0
          for t in "fits:io.github.bapoteet.fits-image:FITS astronomy image:fits fit fts" "xisf:io.github.bapoteet.xisf-image:XISF astronomy image (PixInsight):xisf"; do
            IFS=: read -r key uti desc exts <<< "$t"
            $PB -c "Add :UTImportedTypeDeclarations:$i dict" $PL
            $PB -c "Add :UTImportedTypeDeclarations:$i:UTTypeIdentifier string $uti" $PL
            $PB -c "Add :UTImportedTypeDeclarations:$i:UTTypeDescription string $desc" $PL
            $PB -c "Add :UTImportedTypeDeclarations:$i:UTTypeConformsTo array" $PL
            $PB -c "Add :UTImportedTypeDeclarations:$i:UTTypeConformsTo:0 string public.data" $PL
            $PB -c "Add :UTImportedTypeDeclarations:$i:UTTypeTagSpecification dict" $PL
            $PB -c "Add :UTImportedTypeDeclarations:$i:UTTypeTagSpecification:public.filename-extension array" $PL
            j=0; for e in $exts; do $PB -c "Add :UTImportedTypeDeclarations:$i:UTTypeTagSpecification:public.filename-extension:$j string $e" $PL; j=$((j+1)); done
            i=$((i+1))
          done
          $PB -c "Add :CFBundleDocumentTypes array" $PL || true
          $PB -c "Add :CFBundleDocumentTypes:0 dict" $PL
          $PB -c "Add :CFBundleDocumentTypes:0:CFBundleTypeName string Astronomy image (FITS / XISF)" $PL
          $PB -c "Add :CFBundleDocumentTypes:0:CFBundleTypeRole string Viewer" $PL
          $PB -c "Add :CFBundleDocumentTypes:0:LSHandlerRank string Alternate" $PL
          $PB -c "Add :CFBundleDocumentTypes:0:LSItemContentTypes array" $PL
          $PB -c "Add :CFBundleDocumentTypes:0:LSItemContentTypes:0 string io.github.bapoteet.fits-image" $PL
          $PB -c "Add :CFBundleDocumentTypes:0:LSItemContentTypes:1 string io.github.bapoteet.xisf-image" $PL
          $PB -c "Add :CFBundleDocumentTypes:0:CFBundleTypeExtensions array" $PL
          k=0; for e in fits fit fts xisf; do $PB -c "Add :CFBundleDocumentTypes:0:CFBundleTypeExtensions:$k string $e" $PL; k=$((k+1)); done
          plutil -lint $PL
          codesign --force --deep --sign - dist/SubZeroAstro.app   # ad-hoc signature (needed on Apple silicon)

      - name: Sign and notarize SubZeroAstro.app (Developer ID)
        id: macsign
        if: env.MAC_SIGN == 'true' && (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != '')
        continue-on-error: true           # a signing / notarization problem never stops a release
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          APP=dist/SubZeroAstro.app
          KC="$RUNNER_TEMP/sza-signing.keychain-db"
          KP=$(openssl rand -hex 16)
          printf '%s' "$MACOS_CERT_P12" | tr -d ' \r\n' | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KP" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          ID=$(security find-identity -v -p codesigning "$KC" | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)"/\1/')
          if [ -z "$ID" ]; then echo "No Developer ID Application identity in MACOS_CERT_P12"; exit 1; fi
          echo "Signing as: $ID"
          ENT=assets/macos/entitlements.plist
          # every piece of code inside first (libraries, Python extensions, Qt), then the app itself
          find "$APP/Contents" -type f -print0 | while IFS= read -r -d '' f; do
            if file -b "$f" | grep -q "Mach-O" && [ "$f" != "$APP/Contents/MacOS/SubZeroAstro" ]; then
              codesign --force --timestamp --options runtime --sign "$ID" "$f"
            fi
          done
          codesign --force --deep --timestamp --options runtime --entitlements "$ENT" --sign "$ID" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          # notarization: Apple checks the app (a few minutes), then the ticket is stapled to it
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait --timeout 45m --output-format json > "$RUNNER_TEMP/nt.json" 2>&1 || true
          cat "$RUNNER_TEMP/nt.json"
          # notarytool answers with one JSON object (on stdout, or stderr for a timeout) - read whichever came
          NJS='import json,re,sys;t=open(sys.argv[1]).read();m=re.findall(r"\{.*\}",t);d=json.loads(m[-1]) if m else {};print(d.get(sys.argv[2],""))'
          NID=$(python3 -c "$NJS" "$RUNNER_TEMP/nt.json" id || true)
          NST=$(python3 -c "$NJS" "$RUNNER_TEMP/nt.json" status || true)
          # Apple's first check of a brand-new developer account can take hours; later ones a few minutes
          if [ "$NST" != "Accepted" ]; then
            echo "Notarization: ${NST:-no answer}"
            [ -n "$NID" ] && xcrun notarytool log "$NID" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD" || true
            exit 1
          fi
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=4 "$APP"

      - name: Remove the signing keychain (own Mac keeps no certificate copy between builds)
        if: always() && runner.environment != 'github-hosted'
        run: |
          KC="$RUNNER_TEMP/sza-signing.keychain-db"
          if [ -f "$KC" ]; then
            security list-keychains -d user -s $(security list-keychains -d user | tr -d '"' | grep -v sza-signing)
            security delete-keychain "$KC" || true
          fi

      - name: Back to the ad-hoc signature (signing or notarization failed)
        if: steps.macsign.outcome == 'failure'
        run: codesign --force --deep --sign - dist/SubZeroAstro.app

      - name: Self-test (the built app)
        run: |
          dist/SubZeroAstro.app/Contents/MacOS/SubZeroAstro --selftest "$PWD/selftest_mac_app"
          cat selftest_mac_app/selftest_result.txt

      - name: Package
        run: |
          cp README.md LICENSE docs/SubZeroAstro_User_Manual.pdf dist/
          cd dist && ditto -c -k --sequesterRsrc --keepParent SubZeroAstro.app ../SubZeroAstro-macOS-AppleSilicon.zip

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: SubZeroAstro-macOS-AppleSilicon
          path: SubZeroAstro-macOS-AppleSilicon.zip

      - name: Publish self-test results to the selftest-results-mac branch
        if: always()
        continue-on-error: true           # two builds at once may race for the branch - never block a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p results
          cp -r selftest_mac selftest_mac_app results/ 2>/dev/null || true
          echo "commit ${{ github.sha }}  run ${{ github.run_id }}  $(date -u)" > results/RUN.txt
          cd results
          git init -q -b selftest-results-mac
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Mac self-test results for ${{ github.sha }}"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" selftest-results-mac

      - name: Add the Mac app to the release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
          MACSIGNED: ${{ steps.macsign.outcome }}
        run: |
          gh release upload "$TAG" SubZeroAstro-macOS-AppleSilicon.zip docs/SubZeroAstro_User_Manual.pdf --clobber
          if [ "$MACSIGNED" = "success" ]; then
            BODY=$(gh release view "$TAG" --json body -q .body)
            printf '%s\n\nThe Mac app is signed by the publisher Brian Poteet and notarized by Apple: unzip it and double-click SubZeroAstro.app.\n' "$BODY" > "$RUNNER_TEMP/notes.md"
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi

      - name: Add the Mac app to the downloads repo
        if: (startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != '') && env.DL_ON == 'true'
        env:
          DL_TOKEN: ${{ secrets.DOWNLOADS_TOKEN }}
          DL_REPO: ${{ vars.DOWNLOADS_REPO || 'HowlingStarProjects/SubZeroAstro-Downloads' }}
          TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          # notes come from this repo's release (already including the Mac signing line)
          BODY=$(GH_TOKEN="${{ github.token }}" gh release view "$TAG" --json body -q .body)
          printf '%s\n' "$BODY" > "$RUNNER_TEMP/dl_notes.md"
          export GH_TOKEN="$DL_TOKEN"
          gh release upload "$TAG" SubZeroAstro-macOS-AppleSilicon.zip docs/SubZeroAstro_User_Manual.pdf -R "$DL_REPO" --clobber
          gh release edit "$TAG" -R "$DL_REPO" --notes-file "$RUNNER_TEMP/dl_notes.md"
